services:
  pacdown:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: pacdown:latest
    container_name: pacdown
    restart: unless-stopped
    ports:
      - "8300:8300"
    volumes:
      - ./downloads:/app/downloads          # 下载的视频
      - ./data:/app/data                    # SQLite 数据库
      - ./config:/app/config                # 配置（config.json 挂载到容器内自动加载）
      - ./appdist:/app/appdist              # Windows 客户端 exe 分发目录
    environment:
      - TZ=Asia/Shanghai
      - PACDOWN_APP_EXE=/app/appdist/PacDown.exe
