<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacDown · 全平台视频下载</title>
<link rel="stylesheet" href="/static/css/design.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%238B5CF6'/><stop offset='1' stop-color='%233B82F6'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><path d='M50 24v36m0 0l-14-14m14 14l14-14M32 76h36' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<aside class="sidebar">
  <div class="logo">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
    </span>
    <span class="logo-text">Pac<em>Down</em></span>
  </div>
  <nav class="nav" id="nav">
    <button class="nav-item active" data-page="download">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
      <span>下载</span>
      <i class="nav-dot" id="nav-active-dot" hidden></i>
    </button>
    <button class="nav-item" data-page="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>
      <span>历史</span>
    </button>
    <button class="nav-item" data-page="subs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 12l4.5-2.5M12 3v2m9 7h-2M12 21v-2M3 12h2" opacity=".9"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      <span>订阅</span>
    </button>
    <button class="nav-item" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5A7 7 0 0 0 19 12z"/></svg>
      <span>设置</span>
    </button>
  </nav>
  <div class="sidebar-foot">
    <button class="theme-toggle" id="theme-toggle" title="切换明暗主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="ver">v1.0 · 本地运行</div>
  </div>
</aside>

<main class="main">

  <!-- ============ 下载页 ============ -->
  <section class="page active" id="page-download">
    <header class="page-head">
      <h1>下载视频</h1>
      <p class="sub">粘贴 B站 / 抖音 / 快手 / 小红书链接，无水印保存到本地</p>
    </header>

    <div class="glass input-card">
      <div class="input-row">
        <textarea id="url-input" rows="4" placeholder="粘贴分享链接或整段分享文案，支持一次多个链接（每行一个）&#10;例如：https://v.douyin.com/xxxxxx/"></textarea>
        <div class="input-actions">
          <button class="btn btn-primary" id="btn-parse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m0 0l-6-6m6 6l-6 6"/></svg>
            解析链接
          </button>
          <button class="btn btn-ghost" id="btn-clear" title="清空输入">清空</button>
        </div>
      </div>
      <div class="input-meta">
        <div class="dir-select">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span class="dir-label" id="dir-label">…</span>
          <select id="dir-select" title="切换下载目录"></select>
        </div>
        <div class="quick-opts">
          <label class="opt-chip" title="需要本机安装 ffmpeg"><input type="checkbox" id="opt-audio"><span>提取 MP3</span></label>
          <label class="opt-chip" title="仅 B站视频，保存为 XML 弹幕"><input type="checkbox" id="opt-danmaku"><span>下载弹幕</span></label>
          <label class="opt-chip" title="B站抓取热评 / 抖音抓取评论（免登录），保存在详情与 JSON 中"><input type="checkbox" id="opt-comments"><span>抓取评论</span></label>
        </div>
      </div>
    </div>

    <div id="parse-results" class="parse-results" hidden>
      <div class="section-head">
        <h2>解析结果</h2>
        <div class="section-actions">
          <label class="check-all"><input type="checkbox" id="check-all" checked><span>全选</span></label>
          <button class="btn btn-primary" id="btn-download-selected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
            开始下载
          </button>
        </div>
      </div>
      <div id="parse-list" class="parse-list"></div>
    </div>

    <div class="section-head" id="tasks-head" hidden>
      <h2>下载任务</h2>
      <div class="task-summary" id="task-summary"></div>
    </div>
    <div id="task-list" class="task-list"></div>
  </section>

  <!-- ============ 历史页 ============ -->
  <section class="page" id="page-history">
    <header class="page-head">
      <h1>下载历史</h1>
      <p class="sub">所有已保存视频的数据与文件管理</p>
    </header>
    <div class="stat-row" id="stat-row"></div>
    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="history-search" placeholder="搜索标题或作者">
      </div>
      <select id="history-platform" class="select">
        <option value="">全部平台</option>
        <option value="bilibili">哔哩哔哩</option>
        <option value="douyin">抖音</option>
        <option value="kuaishou">快手</option>
        <option value="xiaohongshu">小红书</option>
        <option value="generic">通用</option>
      </select>
      <select id="history-status" class="select">
        <option value="">全部状态</option>
        <option value="done">已完成</option>
        <option value="failed">失败</option>
      </select>
      <div class="toolbar-spacer"></div>
      <button class="btn btn-ghost" id="btn-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        导出 CSV
      </button>
    </div>
    <div id="history-grid" class="history-grid"></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <!-- ============ 订阅页 ============ -->
  <section class="page" id="page-subs">
    <header class="page-head">
      <h1>订阅追更</h1>
      <p class="sub">订阅 UP主或博主，新视频自动下载到本地</p>
    </header>
    <div class="glass sub-add">
      <input id="sub-url" placeholder="粘贴博主主页链接，如 https://space.bilibili.com/12345">
      <button class="btn btn-primary" id="btn-add-sub">添加订阅</button>
    </div>
    <div id="sub-list" class="sub-list"></div>
  </section>

  <!-- ============ 设置页 ============ -->
  <section class="page" id="page-settings">
    <header class="page-head">
      <h1>设置</h1>
      <p class="sub">保存后立即生效</p>
    </header>
    <div class="settings-grid">
      <form class="glass setting-group" id="form-download">
        <h3>下载</h3>
        <div class="field">
          <label>下载目录</label>
          <input id="set-download-dir" placeholder="D:\Videos">
          <p class="hint">视频按 平台 / 作者 / 日期_标题 分目录保存</p>
        </div>
        <div class="field-row">
          <div class="field">
            <label>同时下载任务数</label>
            <input type="number" id="set-concurrency" min="1" max="8">
          </div>
          <div class="field">
            <label>默认清晰度</label>
            <input id="set-quality" placeholder="best">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>订阅检查间隔（分钟）</label>
            <input type="number" id="set-sub-interval" min="5" max="1440">
          </div>
          <div class="field">
            <label>HTTP 代理</label>
            <input id="set-proxy" placeholder="http://127.0.0.1:7890">
          </div>
        </div>
      </form>
      <form class="glass setting-group" id="form-cookies">
        <h3>平台 Cookie <span class="tag">可选</span></h3>
        <div class="field">
          <label>B站 SESSDATA</label>
          <input id="set-bili-cookie" placeholder="SESSDATA=xxx（解锁 1080P+ 与会员内容）" autocomplete="off">
        </div>
        <div class="field">
          <label>抖音 Cookie</label>
          <input id="set-dy-cookie" placeholder="订阅抖音博主时建议配置" autocomplete="off">
        </div>
        <div class="field">
          <label>快手 Cookie</label>
          <input id="set-ks-cookie" placeholder="提高解析成功率" autocomplete="off">
        </div>
        <div class="field">
          <label>小红书 Cookie</label>
          <input id="set-xhs-cookie" placeholder="小红书解析通常必须配置" autocomplete="off">
        </div>
        <p class="hint">Cookie 仅保存在本机 config.json，用于身份验证，不会上传</p>
      </form>
    </div>
    <div class="settings-save">
      <button class="btn btn-primary" id="btn-save-settings">保存设置</button>
      <span id="settings-saved" class="saved-tip"></span>
    </div>
  </section>
</main>

<!-- 详情弹窗 -->
<div class="modal-mask" id="modal" hidden>
  <div class="modal glass-strong" id="modal-body"></div>
</div>

<!-- 灯箱：全屏预览视频/图片 -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" title="关闭 (Esc)">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" title="上一张 (←)">‹</button>
  <div class="lb-stage" id="lb-stage"></div>
  <button class="lb-nav lb-next" id="lb-next" title="下一张 (→)">›</button>
  <div class="lb-caption" id="lb-caption"></div>
</div>

<div id="toast-root"></div>
<script src="/static/js/app.js"></script>
</body>
</html>
